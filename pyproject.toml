[project]
name = "deepetpicker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "pandas",
  "mrcfile",
  "scikit-image",
  "pillow",
  "pycm==3.0",
  "batchgenerators==0.21",
  "tinyaes",
  "pytorch_lightning>=2.5,<3",
  "opencv-python>=4.10",
  "numpy>2",
  "scipy",
  "setuptools<81",
  "torchvision>=0.28.0",
  "tensorboard>=2.21.0",
  "lightning>=2.6.5",
  "jsonargparse>=4.50.0",
]

[dependency-groups]
gui = [
  "pyqtgraph==0.12.1",
  "PyQt5>=5",
]
test = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "gpu: requires a CUDA device (auto-skipped when unavailable)",
]
